":"movie","release_date":"2026-12-18"},{"id":"the-sheep-detectives","original_title":"The Sheep Detectives","title":"Следствие ведут овечки","overview":"Джордж – пастух, который каждый вечер читает детективные романы своим любимым овцам, полагая, что они ничего не поймут. Но когда на ферме происходит загадочное происшествие, овцы понимают, что им придётся стать детективами. Следуя подсказкам и проверяя подозреваемых людей, они доказывают, что даже овцы могут блестяще раскрывать преступления.","media_type":"movie","release_date":"2026-04-30"},{"id":"the-mandalorian-and-grogu","original_title":"The Mandalorian and Grogu","title":"Мандалорец и Грогу","overview":"Империя пала, но её военачальники всё ещё держат под своим контролем части галактики. Зарождающаяся Новая Республика пытается защитить идеалы, за которые сражались повстанцы, и нанимает для задания мандалорца Дина Джарина, известного охотника за головами, и его юного ученика Грогу.","media_type":"movie","release_date":"2026-05-20"},{"id":"the-super-mario-galaxy-movie","original_title":"The Super Mario Galaxy Movie","title":"Супер Марио: Галактическое кино","overview":"После победы над Боузером и спасения Бруклина, Марио сталкивается со злобным альянсом Варио и Боузера-младшего. Теперь вместе со своими друзьями и Йоши он должен помешать их планам по завоеванию мирового господства.","media_type":"movie","release_date":"2026-04-01"},{"id":"disclosure-day","original_title":"Disclosure Day","title":"День разоблачения","overview":"Человечество узнаёт о прибытии на Землю инопланетян, чьё существование долгое время тщательно скрывалось.","media_type":"movie","release_date":"2026-06-10"},{"id":"voicemails-for-isabelle","original_title":"Voicemails for Isabelle","title":"Сообщения для Изабель","overview":"Девушка отправляет забавные и искренние голосовые сообщения покойной сестре, не подозревая, что их получает незнакомый человек и влюбляется в нее на расстоянии.","media_type":"movie","release_date":"2026-06-20"},{"id":"damage","original_title":"Damage","title":"Ущерб","overview":"Стивен Флеминг и Анна Бартон — совершено разные на первый взгляд люди. Он — пожилой высокопоставленный дипломат, любящий семьянин и отец. Она — молодая скромная предпринимательница, ведущая замкнутый образ жизни. Тем не менее они полюбили друг друга с первого взгляда. Не в силах сопротивляться нахлынувшим чувствам, Стивен полностью отдается всепоглощающей страсти, несмотря на семью, положение в обществе и тот немаловажный факт, что Анна является невестой… его же собственного сына.","media_type":"movie","release_date":"1992-12-02"},{"id":"peaky-blinders-the-immortal-man","original_title":"Peaky Blinders: The Immortal Man","title":"Острые козырьки: бессмертный","overview":"Когда отдалившийся сын гангстера Томми Шелби попадает в нацистский заговор, отцу приходится вернуться в Бирмингем, чтобы спасти свою семью и страну.","media_type":"movie","release_date":"2026-03-05"},{"id":"project-hail-mary","original_title":"Project Hail Mary","title":"Проект «Конец света»","overview":"Астронавт Райленд Грейс просыпается на космическом корабле, не помня ни себя, ни свою миссию. Постепенно мужчина приходит к выводу, что он — единственный выживший из экипажа, отправленного в солнечную систему Тау Кита в поисках спасения от катастрофы на Земле. В поисках ответов Райленду предстоит положиться на свои обширные научные знания, изобретательность и силу воли, но, возможно, ему не придётся искать в одиночку.","media_type":"movie","release_date":"2026-03-15"},{"id":"avatar-fire-and-ash","original_title":"Avatar: Fire and Ash","title":"Аватар: Пламя и пепел","overview":"Джейк Салли, Нейтири и их дети переживают смерть Нетейама. Противостояние с корпорацией RDA обостряется, и теперь семье предстоит столкнуться с враждебным племенем На`ви во главе с Варанг.","media_type":"movie","release_date":"2025-12-17"},{"id":"shelter","original_title":"Shelter","title":"Убежище","overview":"Бывший боец спецотряда MI6 Майкл Мейсон живёт отшельником вместе с псом на одном из небольших уединённых островов Шотландии, скрываясь от своего прошлого. Периодически к нему приплывает на лодке его сослуживец с племянницей Джесси и привозит припасы. Однажды во время шторма лодка переворачивается, дядя девочки погибает, но Майкл успевает спасти Джесси, которая получает серьёзную травму ноги. Поняв, что без лекарств ногу не вылечить, Мейсон выбирается в ближайший городок на материке, где его засекают сотрудники MI6. А вскоре на остров, где находятся Майкл и Джесси, высаживается отряд спецназа.","media_type":"movie","release_date":"2026-01-28"},{"id":"scream-7","original_title":"Scream 7","title":"Крик 7","overview":"Когда в тихом городке, где Сидни Прескотт начала новую жизнь, появляется новый убийца в маске Призрака, её худшие страхи становятся реальностью. Теперь под угрозой оказывается её дочь. Решив защитить семью, Сидни вынуждена вновь столкнуться с ужасами прошлого, чтобы раз и навсегда положить конец кровавой резне.","media_type":"movie","release_date":"2026-02-25"},{"id":"твое-сердце-будет-разбито","original_title":"Твое сердце будет разбито","title":"Твое сердце будет разбито","overview":"Старшеклассница Полина спасается от травли в новой школе и идёт на сделку с главным хулиганом Барсом: он должен притворяться её парнем и защищать, а она делать все, что он скажет. В ходе этой игры у пары появляются настоящие чувства, но у её семьи и одноклассников есть причины разлучить влюблённых.","media_type":"movie","release_date":"2026-03-26"},{"id":"war-machine","original_title":"War Machine","title":"Военная машина","overview":"Во время последней изнурительной миссии на подготовке рейнджеров боевой инженер должен возглавить подразделение в схватке с гигантской потусторонней машиной-убийцей.","media_type":"movie","release_date":"2026-02-12"},{"id":"crime-101","original_title":"Crime 101","title":"Ограбление в Лос-Анджелесе","overview":"Детектив Лу Любник выслеживает похитителя драгоценностей и придерживается правил «Преступления 101» - строгого набора рекомендаций для идеального ограбления.","media_type":"movie","release_date":"2026-02-11"},{"id":"send-help","original_title":"Send Help","title":"На помощь!","overview":"Офисная сотрудница Линда ненавидит своего босса Брэдли Престона. Страдающая от его постоянных издевательств девушка находится на грани нервного срыва и уже готова уволиться, но всё же отправляется с ним в командировку. В результате авиакатастрофы единственными выжившими на необитаемом острове оказываются только Линда и её босс.","media_type":"movie","release_date":"2026-01-22"},{"id":"greenland-2-migration","original_title":"Greenland 2: Migration","title":"Гренландия 2: Миграция","overview":"Найдя безопасный бункер в Гренландии после того, как комета уничтожила Землю, семья Гаррити теперь должна рискнуть всем и отправиться в опасное путешествие по пустошам Европы, чтобы найти новый дом.","media_type":"movie","release_date":"2026-01-07"},{"id":"pretty-lethal","original_title":"Pretty Lethal","title":"Смертельно прекрасна","overview":"5 балерин едут на престижный конкурс, едва разговаривая друг с другом, как вдруг их автобус ломается в глухом лесу. Выбора нет — они вынуждены искать убежище в жутковатой придорожной гостинице, которой заправляет затворница и бывшая звезда балета Девора Касимер. С первого взгляда ясно: здесь что-то не так. И чутьё их не обманывает. Когда ситуация накаляется до предела, враждующим балеринам приходится забыть старые обиды и обратить годы изнурительных тренировок в оружие. Грация, дисциплина и даже пуанты становятся инструментами выживания.","media_type":"movie","release_date":"2026-03-13"},{"id":"goat","original_title":"GOAT","title":"Goat: Мечтай по-крупному","overview":"Уилл, маленький козлёнок с большими мечтами, получает уникальный шанс присоединиться к профессионалам и играть в роарбол — высокоинтенсивный, смешанный, контактный вид спорта, в котором доминируют самые быстрые и свирепые животные в мире. Новые товарищи Уилла по команде не в восторге от появления маленького козлёнка в их составе, но Уилл полон решимости совершить революцию в этом виде спорта и раз и навсегда доказать, что «размер игре не помеха»! ​​Ему предстоит сделать то, чего он никогда раньше не делал.","media_type":"movie","release_date":"2026-02-11"},{"id":"zootopia-2","original_title":"Zootopia 2","title":"Зверополис 2","overview":"Джуди и Ник теперь полноценная команда в полиции. Но их спокойная служба резко меняется, когда в городе появляется загадочный преступник-рептилия, способный ставить под угрозу весь порядок в Зверополисе. Чтобы разобраться в деле, героям приходится углубиться в новые районы города, куда обычным жителям лучше не соваться. Расследование быстро выходит за рамки привычных правил: Джуди и Ник работают под прикрытием, сталкиваются с непредсказуемыми союзниками и опасными врагами, а также вынуждены доверять друг другу сильнее, чем когда-либо.","media_type":"movie","release_date":"2025-11-26"},{"id":"lake-jesup-bonecrushers-revenge","original_title":"Lake Jesup: Bonecrusher's Revenge","title":"Lake Jesup: Bonecrusher's Revenge","overview":"","media_type":"movie","release_date":"2024-05-01"},{"id":"whistle","original_title":"Whistle","title":"Свист","overview":"Компания старшеклассников навлекает на себя смертельную опасность, обнаружив ацтекский свисток смерти, чей звук пробуждает и призывает их погибель. По мере того, как число жертв растёт, они изучают историю артефакта в надежде остановить роковую цепь событий, которую они невольно запустили.","media_type":"movie","release_date":"2026-01-20"},{"id":"wuthering-heights","original_title":"\"Wuthering Heights\"","title":"“Грозовой перевал”","overview":"По пути домой хозяин поместья «Грозовой перевал» мистер Эрншо привозит в поместье найденного на улицах Ливерпуля сироту. Так Хитклифф обретает дом и становится спутником хозяйской дочери Кэтрин — со временем они становятся неразлучными. Годы спустя поместье приходит в упадок из-за пьянства и долгов Эрншо, а повзрослевший Хитклифф остаётся в доме в положении слуги.  Кэтрин мечтает вырваться из мрачной жизни на пустошах и принимает предложение богатого соседа Эдгара Линтона. Услышав её слова о том, что брак с ним унизил бы её, Хитклифф покидает дом. Спустя годы он возвращается состоятельным и ожесточённым, выкупает «Грозовой перевал» и вновь сближается с Кэтрин.","media_type":"movie","release_date":"2026-02-11"},{"id":"return-to-silent-hill","original_title":"Return to Silent Hill","title":"Возвращение в Сайлент Хилл","overview":"После исчезновения возлюбленной художник Джеймс Сандерленд пребывает в депрессии и топит печаль в алкоголе. Внезапно получив от неё письмо, он отправляется в место, где они когда-то были счастливы, — в курортный городок Сайлент Хилл в штате Мэн. Но Сайлент Хилл уже не тот.","media_type":"movie","release_date":"2026-01-21"},{"id":"hoppers","original_title":"Hoppers","title":"Прыгуны","overview":"Учёные разработали технологию, позволяющую переносить человеческое сознание в максимально реалистичных роботизированных животных, что дает людям возможность общаться с животными. Мейбл, любительница животных, получает доступ к технологии. Она переносится в тело робота-бобра и отправляется исследовать животный мир.","media_type":"movie","release_date":"2026-03-04"},{"id":"mercy","original_title":"Mercy","title":"Милосердие","overview":"Недалёкое будущее, уровень преступности, караемой смертной казнью, резко возрос. Детектива обвиняют в совершении тяжкого преступления, и он вынужден доказывать свою невиновность.","media_type":"movie","release_date":"2026-01-20"},{"id":"vanaveera","original_title":"Vanaveera","title":"Vanaveera","overview":"","media_type":"movie","release_date":"2026-02-13"},{"id":"eastenders","original_title":"EastEnders","title":"Жители Ист-Энда","overview":"Сериал о повседневной жизни простых жителей вымышленного округа Уолфорд в восточной части Лондона.","media_type":"tv","release_date":"1985-02-19"},{"id":"q","original_title":"オバケのQ太郎","title":"Привидение Кью-Таро","overview":"Обакэ — маленький и безобидный обакэ (демон), похожий внешне на утёнка, который любит летать, пугая прохожих людей, но сам страшно боится собак. Он начинает жить в семье Охара и дружится с мальчиком по имени Сёта, вместе они будут попадать в забавные ситуации и решать проблемы.","media_type":"tv","release_date":"1985-04-01"},{"id":"bones","original_title":"Bones","title":"Кости","overview":"Доктор Темперанс Бреннан, блестящий, но одинокий антрополог получает то, чего она меньше всего желала — напарника. Бюро посылает ей амбициозного агента ФБР Сили Бута, чтобы помочь в расследовании нераскрытых дел путем изучения и идентификации костей давно пропавших людей.\n\nНо давно умершие жертвы не единственное, с чем придется столкнуться Боунс, Буту и их команде, раскрывая преступления они часто сталкиваются с взяточничеством, коррупцией и местной разрозненностью.","media_type":"tv","release_date":"2005-09-13"},{"id":"the-simpsons-2","original_title":"The Simpsons","title":"Симпсоны","overview":"Семейство Симпсонов — папаша Гомер, мама Мардж, дочери Лиза и маленькая Мэгги, и несносный подросток Барт — проживают в среднестатистическом городке Спрингфилд. Гомер трудится на местной атомной станции, Мардж занимается домом и детьми, любознательная Лиза отлично учится в школе, а Барт постоянно попадает во всякие переделки.","media_type":"tv","release_date":"1989-12-17"},{"id":"supernatural","original_title":"Supernatural","title":"Сверхъестественное","overview":"Сериал рассказывает о приключениях братьев Сэма и Дина Винчестеров, которые путешествуют по Соединённым Штатам на чёрном автомобиле Chevrolet Impala 1967 года, расследуют паранормальные явления, многие из которых основаны на американских городских легендах и фольклоре, и сражаются с порождениями зла, такими как демоны и призраки.","media_type":"tv","release_date":"2005-09-13"},{"id":"la-revuelta","original_title":"La Revuelta","title":"La Revuelta","overview":"","media_type":"tv","release_date":"2024-09-09"},{"id":"greys-anatomy","original_title":"Grey's Anatomy","title":"Анатомия страсти","overview":"В центре событий — молодая женщина-хирург Мередит Грей, дочь известного врача Эллис Грей. Она работает в городской больнице Сиэтла, и её коллеги, такие же начинающие врачи, как она. Хирурги оперируют и влюбляются, заводят истории болезни и служебные романы, хранят свои врачебные тайны, борются с осложнениями у пациентов и в собственной личной жизни. И зачастую отношения с противоположным полом волнуют их не меньше, чем вопрос приобретения ими профессионального опыта.","media_type":"tv","release_date":"2005-03-27"},{"id":"ncis","original_title":"NCIS","title":"Морская полиция: Спецотдел","overview":"Сериал о приключениях команды профессиональных спецагентов. Их миссия — расследовать преступления, которые каким-то образом связаны со служащими морской пехоты. Группу следователей возглавляет специальный агент Гиббс. Его команда — это экс-детектив Энтони ДиНоззо, выхоженка из Моссад — Зива Давид, специалисты в области судмедэкспертизы — Эбби Шуто и Дональд Маллард, а также профессионал в области IT — Тимоти МакГи.","media_type":"tv","release_date":"2003-09-23"},{"id":"law-order","original_title":"Law & Order","title":"Закон и порядок","overview":"В системе уголовного судопроизводства обвинение представляют две независимые, равные по значению инстанции — полиция, расследующая преступления, и прокурор, представляющий дело в суде.","media_type":"tv","release_date":"1990-09-13"},{"id":"law-order-special-victims-unit-2","original_title":"Law & Order: Special Victims Unit","title":"Закон и порядок. Специальный корпус","overview":"В системе судопроизводства преступления на сексуальной почве считаются особенно тяжкими. В Нью-Йорке подобные преступления расследуют детективы элитного подразделения, известного как Особый отдел. Это рассказ о них.","media_type":"tv","release_date":"1999-09-20"},{"id":"the-rookie","original_title":"The Rookie","title":"Новичок","overview":"Начинать с чистого листа всегда нелегко, особенно для уроженца маленького городка Джона Нолана, который после инцидента, перевернувшего его жизнь, решил воплотить в жизнь давнюю мечту и присоединиться к полиции Лос-Анджелеса. Возрастного новичка встречают с понятным скептицизмом, однако жизненный опыт, упорство и чувство юмора дают Джону преимущество.","media_type":"tv","release_date":"2018-10-16"},{"id":"movie","original_title":"霹靂布袋戲","title":"霹靂布袋戲","overview":"","media_type":"tv","release_date":"1988-06-01"},{"id":"family-guy","original_title":"Family Guy","title":"Гриффины","overview":"Типичная американская семья, члены которой способны разбить все возможные стереотипы. А говорящая собака с сигаретой и сухим мартини... А грудной малыш, мечтающий поработить весь мир... Разве это отклонение? Это катарсис в каждом эпизоде!","media_type":"tv","release_date":"1999-01-31"},{"id":"peaky-blinders","original_title":"Peaky Blinders","title":"Острые козырьки","overview":"Британский сериал о криминальном мире Бирмингема 20-х годов прошлого века, в котором многолюдная семья Шелби стала одной из самых жестоких и влиятельных гангстерских банд послевоенного времени. Фирменным знаком группировки, промышлявшей грабежами и азартными играми, стали зашитые в козырьки лезвия.","media_type":"tv","release_date":"2013-09-12"},{"id":"frasier","original_title":"Frasier","title":"Фрейзер","overview":"После развода известный бостонский психиатр Фрейзер Крэйн приезжает в родной Сиэтл, чтобы начать жизнь заново. Его отец Мартин, отставной полицейский, брат Нэйл и собака Эдди рады возвращению Фрейзера. Еще его ждет новая работа эфирного радио-психиатра, откликающегося на имя «Я Слушаю» и масса внештатных и комических ситуаций на работе и дома.","media_type":"tv","release_date":"1993-09-16"},{"id":"csi-crime-scene-investigation","original_title":"CSI: Crime Scene Investigation","title":"C.S.I. Место преступления","overview":"Лас-Вегас… Своими яркими неоновыми огнями, сотнями игровых клубов и казино он манит всё новых и новых людей. Но далеко не все из них оказываются добропорядочными гражданами. В огромном людском потоке частенько прячутся преступники всех мастей. Они убеждены, что их злодеяния останутся незамеченными. Но они сильно ошибаются, ведь в городе работает неутомимая команда полиции C.S.I. Когда следствие заходит в тупик, в игру вступает группа суперпрофессиональных криминалистов во главе с капитаном Гриссомом.","media_type":"tv","release_date":"2000-10-06"},{"id":"the-talk","original_title":"The Talk","title":"The Talk","overview":"","media_type":"tv","release_date":"2010-10-18"},{"id":"watch-what-happens-live-with-andy-cohen","original_title":"Watch What Happens Live with Andy Cohen","title":"Смотрите, что происходит: Прямой эфир","overview":"Исполнительный директор телеканала Bravo Энди Коэн обсуждает темы поп-культуры со знаменитостями и участниками реалити-шоу.","media_type":"tv","release_date":"2009-07-16"},{"id":"house-2","original_title":"House","title":"Доктор Хаус","overview":"Сериал рассказывает о команде врачей, которые должны правильно поставить диагноз пациенту и спасти его. Возглавляет команду доктор Грегори Хаус, который ходит с тростью после того, как его мышечный инфаркт в правой ноге слишком поздно правильно диагностировали. Как врач Хаус просто гений, но сам не отличается проникновенностью в общении с больными и с удовольствием избегает их, если только есть возможность. Он сам всё время проводит в борьбе с собственной болью, а трость в его руке только подчеркивает его жесткую, ядовитую манеру общения. Порой его поведение можно назвать почти бесчеловечным, и при этом он прекрасный врач, обладающий нетипичным умом и безупречным инстинктом, что снискало ему глубокое уважение. Будучи инфекционистом, он ещё и замечательный диагност, который любит разгадывать медицинские загадки, чтобы спасти кому-то жизнь. Если бы все было по его воле, то Хаус лечил бы больных не выходя из своего кабинета.","media_type":"tv","release_date":"2004-11-16"},{"id":"cheers","original_title":"Cheers","title":"Чирс","overview":"«Чирс» — это название небольшого бара в Бостоне, которым владеет Сэм «Мэйдэй» Мэлоун, бывшая звезда бейсбола. Сэм, персонал и завсегдатаи бара каждый день болтают о проблемах, смеются друг над другом, обсуждают забавные случаи из жизни. Все это, разумеется, сдобрено солидной порцией алкоголя. На шутках, юморе и дружелюбных подколках и строится весь сериал.","media_type":"tv","release_date":"1982-09-30"},{"id":"resident-evil","original_title":"Resident Evil","title":"Обитель зла","overview":"Медицинский курьер Брайан отправляется выполнить обычную доставку, но внезапно оказывается в центре кошмарной вспышки, охватившей Раккун-Сити. Город погружается в хаос, а на улицах появляются заражённые люди и чудовищные существа. Оказавшись один на один с надвигающейся угрозой, Брайан вынужден искать путь через охваченный катастрофой город, используя всё, что может помочь ему выжить. С каждой минутой ситуация становится всё опаснее, превращая простую доставку в отчаянную борьбу за жизнь.","media_type":"movie","release_date":"2026-09-16"},{"id":"the-dark-knight","original_title":"The Dark Knight","title":"Тёмный рыцарь","overview":"Бэтмен поднимает ставки в войне с криминалом. С помощью лейтенанта Джима Гордона и прокурора Харви Дента он намерен очистить улицы от преступности, отравляющей город. Сотрудничество оказывается эффективным, но скоро они обнаружат себя посреди хаоса, развязанного восходящим криминальным гением, известным испуганным горожанам под именем Джокер.","media_type":"movie","release_date":"2008-07-16"},{"id":"heart-of-the-beast","original_title":"Heart of the Beast","title":"Сердце зверя","overview":"После авиакатастрофы офицер спецназа Джеймс Белмонт и его боевая собака Один оказываются в глухой и суровой местности Аляски. Оставшись без связи и помощи, они вынуждены преодолевать заснеженные просторы, голод, холод и опасность диких животных. Пытаясь найти путь к цивилизации, Джеймс и Один проходят через тяжёлые испытания, полагаясь друг на друга и на свою подготовку. Их путешествие постепенно превращается в борьбу не только за выживание, но и за возвращение домой.","media_type":"movie","release_date":"2026-09-19"},{"id":"the-odyssey","original_title":"The Odyssey","title":"Одиссея","overview":"После Троянской войны Одиссей, царь Итаки, во главе небольшого войска возвращается домой к своей жене Пенелопе. На своём пути Одиссей сталкивается со множеством испытаний, встречает циклопов, сирен и великанов-людоедов.","media_type":"movie","release_date":"2026-07-15"},{"id":"spider-man-brand-new-day","original_title":"Spider-Man: Brand New Day","title":"Человек-паук: Новый день","overview":"Одинокий и повзрослевший Питер Паркер полностью посвящает себя борьбе с преступностью в Нью-Йорке, поскольку 4 года назад после заклинания Доктора Стрэнджа мир и все близкие забыли его. Но с ростом угроз и нагрузки на Человека-паука, его способности претерпевают странные изменения, способные поставить под угрозу его существование. Тем временем в городе случается новая цепочка преступлений, которая приводит к появлению одного из самых опасных противников в жизни Питера.","media_type":"movie","release_date":"2026-07-29"},{"id":"movie-2","original_title":"호프","title":"Надежда","overview":"В небольшом городке Хоуп-Харбор начинают происходить жуткие события: местные жители обнаруживают растерзанных животных, а вскоре появляются и человеческие жертвы. Пока начальник полиции Бом-сок пытается разобраться в происходящем, группа охотников отправляется в лес на поиски загадочного хищника, которого подозревают в нападениях. Однако вскоре становится ясно, что угроза не имеет ничего общего с обычным зверем. Обнаружение таинственного внеземного объекта превращает расследование в отчаянную борьбу за выживание, где жители сталкиваются с существами, чьи возможности превосходят всё, что они могли себе представить.","media_type":"movie","release_date":"2026-07-15"},{"id":"apocalipsis-z-nuevo-mundo","original_title":"Apocalipsis Z: Nuevo mundo","title":"Апокалипсис Z: Новый мир","overview":"Миссия по доставке грузов в охваченную вирусом Испанию оборачивается сложной задачей, когда к ней присоединяется Роберто с безопасных Канарских островов, преследующий тайные намерения. Команда сталкивается с толпами заражённых и проблемами доверия, пытаясь найти баланс между выживанием и гуманностью.","media_type":"movie","release_date":"2026-10-09"},{"id":"a-story-of-derry","original_title":"A Story of Derry","title":"История Дерри","overview":"За несколько столетий до появления города Дерри и легендарного клоуна Пеннивайза на этих землях обитает древнее существо, известное как Та Галлу. Когда индейское племя начинает сталкиваться с необъяснимыми исчезновениями и нападениями в Западном лесу, дочь вождя Никани, вместе со своими друзьями отправляется исследовать запретную территорию. Там подростки встречают загадочное существо, способное принимать облик мертвецов и вселять ужас в живых. Спасённые местным жителем, они узнают древнюю историю о происхождении этого зла, его связи с космической черепахой Матурин и падении звезды, освободившей чудовище на Земле. Постепенно становится ясно, что обычного спасения недостаточно: чтобы защитить свой народ и будущие поколения, героям предстоит раскрыть тайну существа и создать границу, которая на долгие века удержит древнее зло в пределах проклятых земель.","media_type":"movie","release_date":"2026-10-31"},{"id":"the-hotel-new-hampshire","original_title":"The Hotel New Hampshire","title":"Отель «Нью-Хэмпшир»","overview":"Экранизация одноимённого романа американского писателя Джона Ирвинга.\r История американской семьи Берри. Глава семьи Уин Берри, работавший школьным учителем, решает открыть отель «Нью-Хэмпшир». Ему помогают жена и дети — Джон, Фрэнни, Фрэнк, Лилли и самый младший сын по кличке Эмбрион.\r Джон испытывает к сестре Фрэнни сексуальное влечение, за что подвергается насмешкам с её стороны, а также Фрэнка, являющегося гомосексуалом.\r После получения приглашения от старого знакомого Фрейда семья переезжает в Австрию.","media_type":"movie","release_date":"1984-03-09"},{"id":"coco","original_title":"Coco","title":"Тайна Коко","overview":"12-летний Мигель живёт в мексиканской деревушке в семье сапожников и тайно мечтает стать музыкантом. Тайно, потому что в его семье музыка считается проклятием. Когда-то его прапрадед оставил жену, прапрабабку Мигеля, ради мечты, которая теперь не даёт спокойно жить и его праправнуку. С тех пор музыкальная тема в семье стала табу. Мигель обнаруживает, что между ним и его любимым певцом Эрнесто де ла Крусом, ныне покойным, существует некая связь. Паренёк отправляется к своему кумиру в Страну Мёртвых, где встречает души предков. Мигель знакомится там с духом-скелетом по имени Гектор, который становится его проводником. Вдвоём они отправляются на поиски де ла Круса.","media_type":"movie","release_date":"2017-10-27"},{"id":"0-0","original_title":"ゴジラ-0.0","title":"Годзилла: Минус ноль","overview":"Война отбросила Японию к нулевой отметке, а Годзилла загнал её в «минус». С тех пор прошло два года; страна с огромным трудом пытается восстановиться и вернуть себе привычную жизнь. Но едва человечеству удалось удержать с таким трудом добытый мир, как возникла новая угроза — и в одно мгновение уничтожила все надежды. Третьего шанса не будет. Здесь всё закончится.","media_type":"movie","release_date":"2026-11-03"},{"id":"the-mongoose","original_title":"The Mongoose","title":"Мангуст","overview":"Обвинённый в преступлении, которого он не совершал, герой войны Райан «Клык» Флэнаган пускается в бега через полстраны. Полиция идёт по его следу, бывшие сослуживцы помогают скрыться, а миллионы зрителей следят за погоней в прямом эфире и болеют за его спасение.","media_type":"movie","release_date":"2026-10-29"},{"id":"verity","original_title":"Verity","title":"Тайный дневник Верити","overview":"Нуждающаяся в работе писательница Лоуэн Эшли получает предложение от Джереми Кроуфорда — ей нужно дописать романы его жены. Жена Джереми — автор популярной серии романов Верити Кроуфорд, и из-за загадочного несчастного случая она не может закончить произведения. Работа принимает неожиданный оборот, когда Лоуэн находит тревожные личные записки Верити. Сталкиваясь с семейными тайнами, Лоуэн пытается отделить вымысел от реальности, в то время как границы в её отношениях с Джереми размываются.","media_type":"movie","release_date":"2026-09-30"},{"id":"movie-3","original_title":"रामायणम्","title":"Рамаяна. Возрождение легенды","overview":"","media_type":"movie","release_date":"2026-11-05"},{"id":"beware-boiuna","original_title":"Beware Boiúna","title":"Монстр Амазонки","overview":"Группа врачей отправляется с гуманитарной миссией в амазонские джунгли, но вскоре они обнаруживают разорённую деревню и сталкиваются с Боюной - гигантской чёрной змеёй, которая открывает охоту на группу.","media_type":"movie","release_date":"2026-10-01"},{"id":"el-despertar","original_title":"El despertar","title":"El despertar","overview":"","media_type":"movie","release_date":"2026-10-29"},{"id":"la-bola-negra","original_title":"La bola negra","title":"Чёрный шар","overview":"3 мужчины, живущие в разные эпохи - в 1932-ом, 1937-ом и 2017-ом годах, оказываются связаны между собой историей желания, любви, боли и наследия. Их судьбы перекликаются через поколения, показывая, как отношение к однополой любви меняется со временем, но оставленные прошлым травмы продолжают влиять на людей спустя десятилетия.","media_type":"movie","release_date":"2026-09-25"},{"id":"drive-the-pretenders","original_title":"Drive – The Pretenders","title":"Драйв: Притворщики","overview":"Молодой гоночный механик имитирует помолвку с самой скандальной звездой автоспорта — официально ради спасения её репутации, а на деле — чтобы получить шанс самой сесть за руль. Но вскоре эта ложь начинает угрожать всему — в том числе тому, что уже переросло рамки простой сделки.","media_type":"movie","release_date":"2026-10-27"},{"id":"fall-2-deadpoint","original_title":"Fall 2: Deadpoint","title":"Вышка 2","overview":"После трагической гибели на вышке B67 видео Шайло разлетелись по сети, а сама она стала легендой среди экстремалов. Однако ее сестра Джакс так и не смогла смириться с утратой. Она находит список самых экстремальных мест на планете, которые Шайло мечтала покорить, и решает пройти его до конца. Следующая цель — смертельно опасный маршрут на горе Кван в Таиланде высотой 2070 метров над уровнем моря. Джакс вместе с подругой и местным гидом отправляется наверх, где ей предстоит столкнуться со своим главным страхом — повторить судьбу сестры.","media_type":"movie","release_date":"2026-09-01"},{"id":"doctor-who","original_title":"Doctor Who","title":"Доктор Кто","overview":"Инопланетянин-гуманоид, называющий себя Доктором, путешествует через время и пространство в космическом корабле, который снаружи выглядит как полицейская будка 50-х годов. Доктор чрезвычайно эксцентричен и имеет невероятные знания в областях технологии, истории и науки. Он путешествует вместе со своими компаньонами, попутно борясь против космических злодеев и спасая Землю от бесчисленных врагов.","media_type":"tv","release_date":"2005-03-26"},{"id":"phineas-and-ferb","original_title":"Phineas and Ferb","title":"Финес и Ферб","overview":"Мультфильм о двух сводных братьях на летних каникулах, живущих в пригороде. Каждый день они придумывают безумные планы и строят невероятные изобретения, из-за чего они часто конфликтуют со своей сестрой. Наряду с этим домашний любимец мальчиков утконос Пэрри, действующий как секретный агент, пытается все время остановить злейшего, но придурковатого ученого по имени Хайнц Дуфеншмирц.","media_type":"tv","release_date":"2007-08-17"},{"id":"law-order-special-victims-unit-2","original_title":"Law & Order: Special Victims Unit","title":"Закон и порядок. Специальный корпус","overview":"В системе судопроизводства преступления на сексуальной почве считаются особенно тяжкими. В Нью-Йорке подобные преступления расследуют детективы элитного подразделения, известного как Особый отдел. Это рассказ о них.","media_type":"tv","release_date":"1999-09-20"},{"id":"the-kelly-clarkson-show","original_title":"The Kelly Clarkson Show","title":"Шоу Келли Кларксон","overview":"","media_type":"tv","release_date":"2019-09-09"},{"id":"the-girlfriend","original_title":"The Girlfriend","title":"Девушка моего сына","overview":"У Лауры есть всё: блестящая карьера, любящий муж и её самый большой дар — сын Даниэль. Но идиллия рушится, когда Даниэль приводит домой девушку по имени Черри. С первого знакомства между женщинами возникает напряжение, и Лаура всё больше убеждается, что Черри что-то скрывает. Она — хитрая манипуляторша, стремящаяся пробиться наверх, или же это лишь плод материнской паранойи? Истина зависит от того, с чьей стороны смотреть","media_type":"tv","release_date":"2025-09-10"},{"id":"modern-family","original_title":"Modern Family","title":"Американская семейка","overview":"Современная американская семья: Джей Притчетт познакомился со сногсшибательной колумбийкой Глорией, когда она в бикини подавала ему коктейли на вечеринке, которую он устроил в день ухода егo первой жены. Теперь Джей и Глория женаты, и Джей изо всех сил старается не отставать от молодой красотки-жены и ее сына-подростка. В семье Клэр Дельгадо тоже не все гладко. Ее муж Фил - просто замечательный, но он считает, что «свой в доску» для своих детей, чем их сильно смущает.","media_type":"tv","release_date":"2009-09-23"},{"id":"the-office","original_title":"The Office","title":"Офис","overview":"Сериал о трудовых буднях небольшого регионального офиса крупной компании, обитатели которого целыми днями должны терпеть закидоны своего непутевого босса.","media_type":"tv","release_date":"2005-03-24"},{"id":"the-last-kingdom","original_title":"The Last Kingdom","title":"Последнее королевство","overview":"Сериал рассказывает о временах правления короля Уэссекса Альфреда Великого, сумевшего отвоевать английские земли у датских викингов — заморских захватчиков. Главным героем повествования выступает ещё в младенчестве похищенный данами Утред — потомок благородного саксонского рода. Воспитанный как викинг, в очень непростой момент жизненного выбора молодой воин должен будет решить для себя, чью сторону он примет в решающих сражениях за судьбу древней Британии.","media_type":"tv","release_date":"2015-10-10"},{"id":"how-i-met-your-mother","original_title":"How I Met Your Mother","title":"Как я встретил вашу маму","overview":"История начинается в недалёком будущем. Главный герой – Тэд Мосби рассказывает своим детям как он жил, когда был подростком, историю встречи с их матерью и развитие их отношений в дальнейшем. Так же, Тэд рассказывает забавные случаи из своей жизни, в которой активно принимали участие его друзья.\n\nОдин из друзей Тэда, Маршалл, решает сделать предложение руки и сердца своей девушке Лили, которая работает воспитателем в детском саду. Это событие заставляет Тэда, который до этого момента был одиноким человеком, задуматься о поиске спутницы жизни. В этом ему активно помогает его друг Барни, который будучи заядлым холостяком, даёт не самые «дельные» советы. Но, как ни странно, именно благодаря Барни, Тэд знакомится с прекрасной девушкой по имени Робин. Она настолько сильно начинает нравиться главному герою, что тот думает, что она – та самая, любовь всей его жизни. Вот только, у судьбы на этот счёт совсем другие планы…","media_type":"tv","release_date":"2005-09-19"},{"id":"the-simpsons-2","original_title":"The Simpsons","title":"Симпсоны","overview":"Семейство Симпсонов — папаша Гомер, мама Мардж, дочери Лиза и маленькая Мэгги, и несносный подросток Барт — проживают в среднестатистическом городке Спрингфилд. Гомер трудится на местной атомной станции, Мардж занимается домом и детьми, любознательная Лиза отлично учится в школе, а Барт постоянно попадает во всякие переделки.","media_type":"tv","release_date":"1989-12-17"},{"id":"house-2","original_title":"House","title":"Доктор Хаус","overview":"Сериал рассказывает о команде врачей, которые должны правильно поставить диагноз пациенту и спасти его. Возглавляет команду доктор Грегори Хаус, который ходит с тростью после того, как его мышечный инфаркт в правой ноге слишком поздно правильно диагностировали. Как врач Хаус просто гений, но сам не отличается проникновенностью в общении с больными и с удовольствием избегает их, если только есть возможность. Он сам всё время проводит в борьбе с собственной болью, а трость в его руке только подчеркивает его жесткую, ядовитую манеру общения. Порой его поведение можно назвать почти бесчеловечным, и при этом он прекрасный врач, обладающий нетипичным умом и безупречным инстинктом, что снискало ему глубокое уважение. Будучи инфекционистом, он ещё и замечательный диагност, который любит разгадывать медицинские загадки, чтобы спасти кому-то жизнь. Если бы все было по его воле, то Хаус лечил бы больных не выходя из своего кабинета.","media_type":"tv","release_date":"2004-11-16"},{"id":"monk","original_title":"Monk","title":"Дефективный детектив","overview":"Казалось, ничто не в силах помешать стремительному восхождению к вершинам карьеры детектива Эдриана Монка. Но нераскрытое убийство любимой жены - Труди - явилось слишком сильным ударом для суперпрофессионала. Пережитая драма повлекла за собой серьезные психологические расстройства, абсолютно несовместимые с работой в полиции. И службу пришлось оставить. Рядом с Монком теперь постоянно находится медсестра Шарона, которая пытается помочь ему восстановить утраченные душевные и физические силы. И постепенно Шарона становится для Монка кем-то вроде доктора Ватсона при Шерлоке Холмсе. А тем временем полицейский департамент бьется над раскрытием очередного запутанного дела и, в конце концов, осознает необходимость подключения Монка в качестве частного консультанта к расследованию.","media_type":"tv","release_date":"2002-07-12"},{"id":"seinfeld","original_title":"Seinfeld","title":"Сайнфелд","overview":"Злоключения городского невротика, стэнд-ап комика Джерри Сайнфелда и его настолько же неврастенических нью-йоркских друзей.","media_type":"tv","release_date":"1989-07-05"},{"id":"the-vampire-diaries","original_title":"The Vampire Diaries","title":"Дневники вампира","overview":"Прошло всего четыре месяца после трагической аварии, в которой погибли их родители, и 17-летняя Елена Гилберт и ее 15-летний брат Джереми все еще пытаются оправиться от потери и вернуться к нормальной жизни. Елена всегда была отличной ученицей, красивой и популярной девушкой в школе, но теперь ей очень тяжело скрывать свою печаль от внешнего мира. В начале учебного года внимание Елены и ее друзей привлекает новый ученик, загадочный и красивый Стефан Сальваторе.  Стефан и Елена тут же чувствуют взаимную симпатию, но Елена даже не подозревает, что Стефан — вампир, которому уже сотни лет, и который старается мирно жить среди людей, несмотря на то, что его брат, Дэймон — воплощение вампирской жестокости и кровожадности. Теперь два брата-вампира — один добрый, другой злой — ведут борьбу за души Елены, ее друзей и других жителей городка Мистик Фоллз.","media_type":"tv","release_date":"2009-09-10"},{"id":"the-mentalist","original_title":"The Mentalist","title":"Менталист","overview":"После того как серийный убийца убил его семью, Патрик Джейн отказался от карьеры экстрасенса и использует свои способности, чтобы помогать правоохранительным органам.","media_type":"tv","release_date":"2008-09-23"},{"id":"columbo","original_title":"Columbo","title":"Коломбо","overview":"Лейтенант Коломбо - антипод классического детектива: он рассеян и несовременен, со своим одним глазом явно не тянет на красавца, курит дешёвые сигары, всё время ходит в одном и том же мятом плаще, ездит на разваливающемся «Пежо» и за женщинами не ухлёстывает, потому как давно и беспросветно женат.","media_type":"tv","release_date":"1971-09-15"},{"id":"the-it-crowd","original_title":"The IT Crowd","title":"Компьютерщики","overview":"Комические злоключения Роя, Мосса и их хитрой начальницы Джен — «разношёрстной команды» айтишников, работающих в крупной корпорации под руководством вспыльчивого яппи.","media_type":"tv","release_date":"2006-02-03"},{"id":"elena-of-avalor","original_title":"Elena of Avalor","title":"Елена - принцесса Авалора","overview":"Жизнь принцессы Елены из мультфильма «Елена из Авалора» похожа на сказку. Она наслаждалась спокойствием и счастьем рядом с любимыми родителями и сестренкой Изабель в своем удивительном и прекрасном королевстве. Но однажды здесь объявилась колдунья Шураки. Она пленила короля с королевой и их младшую дочь, став единоличной правительницей Авалора. А вот на Елену, которая осмелилась ей противостоять, она наслала свои чары. Под действием могущественного заклинания принцесса была заточена внутрь ожерелья, которое и досталось Софии Прекрасной. Эта девочка с добрым сердцем смогла разгадать секрет своего украшения и освободить Елену из магического заточения.","media_type":"tv","release_date":"2016-07-22"},{"id":"broadchurch","original_title":"Broadchurch","title":"Убийство на пляже","overview":"Дорсетский городок Бродчерч. Жизнь здесь течет спокойно и размеренно, пока в один из летних дней не пропадает одиннадцатилетний мальчик Дэнни Латимер. Его мать обращается за помощью в полицию, где работает ее подруга Элли Миллер. Элли только вышла из отпуска, и на работе ее ждет неприятная новость – место, которое должно было достаться ей, отдано приезжему детективу Алеку Харди, имеющему репутацию неудачника.","media_type":"tv","release_date":"2013-03-04"}],
